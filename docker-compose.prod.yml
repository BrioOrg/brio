# Deployed environment (ADR 0024): the same images and compose file for the private
# instance today and a future production. Everything that differs between
# environments comes from deploy/.env (see deploy/.env.example).
#
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env --profile ingest run --rm ingest
#
# Only Caddy publishes ports. Postgres, the backend, the web server and Mailpit are
# reachable on the compose network only.

# Distinct from the dev compose project (`brio`, the directory name): never share
# its volumes or containers.
name: brio-env

x-backend-env: &backend-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
  # E-mail (ADR 0024 §6): Mailpit on the private environment, an EU provider at
  # publication — only deploy/.env changes. Shared with `ingest`, which never sends
  # but cannot start without an SMTP host outside the local profile.
  SPRING_MAIL_HOST: ${SMTP_HOST:-mailpit}
  SPRING_MAIL_PORT: ${SMTP_PORT:-1025}
  SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
  SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-false}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS:-false}
  BRIO_MAIL_FROM: Brio <no-reply@${BRIO_DOMAIN:?}>

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: brio-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      BRIO_IA_API_KEY: ${BRIO_IA_API_KEY:?}
      # Links in e-mails (consent, revocation) point at the public origin.
      BRIO_FRONTEND_BASE_URL: https://${BRIO_DOMAIN:?}
      # Same origin behind Caddy, so CORS is unused; pinned to the domain regardless.
      APP_CORS_ALLOWED_ORIGINS: https://${BRIO_DOMAIN:?}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: brio-web
    restart: unless-stopped
    environment:
      # SSR calls the backend directly, never through Caddy (ADR 0024 §5).
      API_INTERNAL_URL: http://backend:8080
      TUTEUR_REQUEST_CAP: ${TUTEUR_REQUEST_CAP:-20}
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      # UI served under /mailpit on the environment's origin. SMTP listens on 1025,
      # compose network only; the backend sends every e-mail there (SMTP_HOST).
      MP_WEBROOT: mailpit
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BRIO_DOMAIN: ${BRIO_DOMAIN:?}
      CADDY_USER_1: ${CADDY_USER_1:?}
      CADDY_HASH_1: ${CADDY_HASH_1:?}
      CADDY_USER_2: ${CADDY_USER_2:?}
      CADDY_HASH_2: ${CADDY_HASH_2:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend
      - mailpit

  # One-off catalogue ingestion (ADR 0010) against the same database:
  #   docker compose -f docker-compose.prod.yml --env-file deploy/.env --profile ingest run --rm ingest
  ingest:
    profiles: [ingest]
    image: brio-backend
    environment:
      <<: *backend-env
    command:
      - /app/content
      - --spring.profiles.active=ingest
      # Nothing listens on it; set apart from the backend's port for clarity.
      - --server.port=0
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mailpit_data:
  caddy_data:
  caddy_config:
