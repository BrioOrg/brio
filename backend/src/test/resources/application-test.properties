# Overrides applied under the `test` profile, on top of the main
# src/main/resources/application.properties (which is now loaded by the test suite:
# this file no longer shadows it, see ADR 0034).
#
# Keep this file to genuine test-only overrides. Everything the tests rely on already
# comes from the main file:
#   - app.cors.allowed-origins (needed by CorsConfig) is defined in the main file;
#   - the session-store settings (table name, cookie name, schema init) come from the
#     main file, so SessionPersistanceIntegrationTest checks the deployed values;
#   - RecordingEmailSender is selected by the `test` profile (@Profile({"local","test"})),
#     activated with @ActiveProfiles("test") on the @SpringBootTest classes.
#
# The profile itself is NOT set here: a profile-specific file cannot activate its own
# profile.

# Rétention social : pas de déclencheur planifié pendant les tests ; la purge est exercée
# explicitement par ses tests (ADR 0023 §6).
brio.social.retention.active=false
