# Test-only configuration.
# CorsConfig requires app.cors.allowed-origins, which is otherwise only set in the
# `local` profile. Tests don't activate that profile, so provide a value here to let
# the application context load. Value is irrelevant to assertions.
app.cors.allowed-origins=http://localhost:3000

# Selects RecordingEmailSender over SmtpEmailSender (no SMTP server in tests).
spring.profiles.active=test

# This file shadows src/main/resources/application.properties on the test classpath, so
# the session-store settings the tests rely on are repeated here (ADR 0034).
# SessionPersistanceIntegrationTest loads the main file itself to check the real values.
spring.session.jdbc.table-name=identite.spring_session
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.name=JSESSIONID
