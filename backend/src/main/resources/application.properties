spring.application.name=brio-backend

# Datasource — override per environment; dev values match docker-compose
spring.datasource.url=jdbc:postgresql://localhost:5432/brio
spring.datasource.username=brio
spring.datasource.password=brio

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator — internal operational surface only; not exposed in the product API spec
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.show-actuator=false

# Jackson — serialize dates/instants as ISO-8601 strings, not epoch numbers
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS — defaults to localhost:3000 for local dev; override per environment.
app.cors.allowed-origins=http://localhost:3000

# Security — disable default form login for API (replace with real auth later)
spring.security.user.name=dev
spring.security.user.password=dev

# IA / Tuteur — API key injected from environment; never committed
brio.ia.api-key=${BRIO_IA_API_KEY:}
brio.ia.model=claude-haiku-4-5-20251001
brio.ia.base-url=https://api.anthropic.com
