spring.application.name=brio-backend

# Datasource — override per environment; dev values match docker-compose
spring.datasource.url=jdbc:postgresql://localhost:5432/brio
spring.datasource.username=brio
spring.datasource.password=brio

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator — internal operational surface only; not exposed in the product API spec
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.show-actuator=false

# Jackson — serialize dates/instants as ISO-8601 strings, not epoch numbers
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS — defaults to localhost:3000 for local dev; override per environment.
app.cors.allowed-origins=http://localhost:3000

# Security — dev/dev credentials kept for local profile HTTP Basic only (see SecurityConfig).
# These credentials are blocked from any non-local profile by BasicAuthGuard at startup.
spring.security.user.name=dev
spring.security.user.password=dev

# Behind a reverse proxy (Caddy, ADR 0024): trust X-Forwarded-* for scheme, host and
# client address. No effect when nothing sets them (local dev).
server.forward-headers-strategy=framework

# Session cookie — Secure by default; relaxed to false in application-local.properties
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# Idle timeout, sliding: every request with the session renews it — the web middleware asks
# /api/moi on each page, so reading the course is activity. The implicit default (30 min)
# logged a student reading a long chapter out mid-lesson (#274). 12h of *inactivity* covers a
# school day and the evening's homework; only a night away logs out (#279). The cookie stays
# session-scoped (no Max-Age), so closing the browser still logs out — safe on shared school
# computers. No "remember me": a long-lived login cookie on a shared computer is the risk the
# session-scoped cookie avoids.
server.servlet.session.timeout=12h

# Session store (ADR 0034): Postgres, through Spring Session JDBC, so a restart or a deploy
# logs nobody out. Spring Session takes its idle timeout (12h, sliding) and its cookie
# attributes from the server.servlet.session.* properties above. Flyway owns the tables
# (V38), never Spring Session's own script.
spring.session.jdbc.table-name=identite.spring_session
spring.session.jdbc.initialize-schema=never
# Spring Session would name its cookie SESSION: keep JSESSIONID, which the web middleware,
# the logout handler and the e2e fake backend rely on.
server.servlet.session.cookie.name=JSESSIONID

# IA / Tuteur — API key injected from environment; never committed
brio.ia.api-key=${BRIO_IA_API_KEY:}
brio.ia.model=claude-haiku-4-5-20251001
brio.ia.base-url=https://api.anthropic.com

# Frontend base URL — used to build confirmation/revocation links in emails.
# Override per environment; never hardcode in source (CLAUDE.md).
brio.frontend.base-url=${BRIO_FRONTEND_BASE_URL:http://localhost:3000}

# E-mail (ADR 0024 §6) — SMTP server from spring.mail.* (SPRING_MAIL_HOST, …), set per
# environment; the `local` and `test` profiles record e-mails in memory instead.
brio.mail.from=${BRIO_MAIL_FROM:Brio <no-reply@localhost>}
# JavaMail waits forever by default: a hung SMTP server would pin a request thread.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Delete event publications once their listener completed. Consent events carry the
# plaintext token links (the database otherwise stores only hashes); an incomplete
# publication (failed send) is kept, which is what allows a resend.
spring.modulith.events.completion-mode=delete

# Fictional établissement of the private environment (ADR 0029 §5): created at startup,
# with a fictional convention, when a name is set. Leave empty on any environment
# holding real data — établissements there are created by an administrator.
brio.etablissement-pilote.nom=${BRIO_ETABLISSEMENT_PILOTE_NOM:}
brio.etablissement-pilote.type=${BRIO_ETABLISSEMENT_PILOTE_TYPE:college}

# F5 — dépôt de copie (ADR 0028). Le binaire vit hors base ; répertoire de stockage local (dev).
# Le vrai stockage objet UE sera branché au déploiement (config).
brio.copies.dir=${BRIO_COPIES_DIR:./data/copies}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Communauté (ADR 0035 §10): no moderation exists yet, so this stays off anywhere real students
# could reach. Off, its API behaves as if it did not exist. Conditions to turn it on for real
# students are listed in the ADR.
brio.communaute.active=${BRIO_COMMUNAUTE_ACTIVE:false}
